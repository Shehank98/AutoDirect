<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — DirectAuto Import</title>
  <link rel="shortcut icon" href="/assets/images/favicon-icon/favicon.png">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/assets/css/orange.css" title="orange">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">
  <style>.auth-card{max-width:440px;margin:50px auto;background:#fff;border:1px solid #eee;border-radius:8px;padding:30px;} .page-title{background:#1c2331;color:#fff;padding:40px 0;}</style>
</head>
<body>
  <div id="site-header"></div>
  <div class="page-title"><div class="container"><h2 style="color:#fff;margin:0;">Login</h2></div></div>
  <section class="container">
    <div class="auth-card">
      <div id="auth-disabled" class="alert alert-warning" style="display:none;">Accounts aren't enabled yet. Configure Firebase on the server to turn on login.</div>
      <form id="login-form">
        <div class="form-group"><label>Email</label><input class="form-control" id="email" type="email" required></div>
        <div class="form-group"><label>Password</label><input class="form-control" id="password" type="password" required></div>
        <button class="btn btn-block" id="login-btn" type="submit">Login</button>
        <div id="login-msg" style="margin-top:12px;"></div>
      </form>
      <p class="text-center" style="margin-top:16px;">No account? <a href="/register">Register here</a></p>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="/assets/js/jquery.min.js"></script>
  <script src="/assets/js/bootstrap.min.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    DA.pageInit = async function () {
      try { await DA.initFirebase(); } catch (e) { document.getElementById('auth-disabled').style.display = 'block'; document.getElementById('login-btn').disabled = true; return; }
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-btn'); const msg = document.getElementById('login-msg');
        btn.disabled = true; btn.textContent = 'Signing in…';
        try {
          await firebase.auth().signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value);
          location.href = '/my-account/';
        } catch (err) { msg.innerHTML = '<span class="text-danger">' + DA.esc(err.message) + '</span>'; btn.disabled = false; btn.textContent = 'Login'; }
      });
    };
  </script>
</body>
</html>
