<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — DirectAuto Import</title>
  <link rel="shortcut icon" href="/assets/images/favicon-icon/favicon.png">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/assets/css/orange.css" title="orange">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">
  <style>.auth-card{max-width:480px;margin:50px auto;background:#fff;border:1px solid #eee;border-radius:8px;padding:30px;} .page-title{background:#1c2331;color:#fff;padding:40px 0;}</style>
</head>
<body>
  <div id="site-header"></div>
  <div class="page-title"><div class="container"><h2 style="color:#fff;margin:0;">Create Account</h2></div></div>
  <section class="container">
    <div class="auth-card">
      <div id="auth-disabled" class="alert alert-warning" style="display:none;">Accounts aren't enabled yet. Configure Firebase on the server to turn on registration.</div>
      <form id="reg-form">
        <div class="form-group"><label>Full name</label><input class="form-control" id="name" required></div>
        <div class="form-group"><label>Email</label><input class="form-control" id="email" type="email" required></div>
        <div class="form-group"><label>Phone</label><input class="form-control" id="phone"></div>
        <div class="form-group"><label>Password</label><input class="form-control" id="password" type="password" minlength="6" required></div>
        <button class="btn btn-block" id="reg-btn" type="submit">Register</button>
        <div id="reg-msg" style="margin-top:12px;"></div>
      </form>
      <p class="text-center" style="margin-top:16px;">Already have an account? <a href="/login">Login</a></p>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="/assets/js/jquery.min.js"></script>
  <script src="/assets/js/bootstrap.min.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    DA.pageInit = async function () {
      try { await DA.initFirebase(); } catch (e) { document.getElementById('auth-disabled').style.display = 'block'; document.getElementById('reg-btn').disabled = true; return; }
      document.getElementById('reg-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('reg-btn'); const msg = document.getElementById('reg-msg');
        btn.disabled = true; btn.textContent = 'Creating…';
        try {
          const cred = await firebase.auth().createUserWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value);
          await cred.user.updateProfile({ displayName: document.getElementById('name').value });
          // Sync profile (name/phone) into our database.
          await cred.user.getIdToken(true);
          try { await DA.api.put('/api/account/me', { name: document.getElementById('name').value, phone: document.getElementById('phone').value }); } catch (e2) {}
          location.href = '/my-account/';
        } catch (err) { msg.innerHTML = '<span class="text-danger">' + DA.esc(err.message) + '</span>'; btn.disabled = false; btn.textContent = 'Register'; }
      });
    };
  </script>
</body>
</html>
