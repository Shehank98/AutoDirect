<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin — DirectAuto Import</title>
  <link rel="shortcut icon" href="/assets/images/favicon-icon/favicon.png">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">
  <style>
    :root{--brand:#f76b1c;--dark:#1c2331;}
    body{font-family:'Open Sans',sans-serif;background:#f4f5f8;color:#333;}
    a{color:var(--brand);} a:hover{color:#d85a10;}
    .btn-brand{background:var(--brand);border-color:var(--brand);color:#fff;} .btn-brand:hover,.btn-brand:focus{background:#d85a10;border-color:#d85a10;color:#fff;}
    #login-view{max-width:400px;margin:90px auto;background:#fff;padding:30px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
    #login-view img{max-width:180px;display:block;margin:0 auto 18px;}
    #app-view{display:none;}
    .sidebar{position:fixed;top:0;bottom:0;left:0;width:220px;background:var(--dark);color:#cfd6e6;overflow-y:auto;z-index:100;}
    .sidebar .brand{padding:16px;background:#fff;text-align:center;} .sidebar .brand img{max-width:150px;}
    .sidebar a.nav-link{display:block;padding:11px 20px;color:#cfd6e6;text-decoration:none;border-left:3px solid transparent;font-size:14px;}
    .sidebar a.nav-link i{width:22px;} .sidebar a.nav-link:hover{background:rgba(255,255,255,.06);color:#fff;}
    .sidebar a.nav-link.active{background:rgba(255,255,255,.1);border-left-color:var(--brand);color:#fff;}
    .sidebar .nav-head{padding:14px 20px 4px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#7d879c;}
    .sidebar .who{padding:16px 20px;font-size:12px;color:#7d879c;border-top:1px solid rgba(255,255,255,.08);margin-top:10px;word-break:break-all;}
    .main{margin-left:220px;padding:26px 30px 60px;}
    .main h2{margin:0 0 20px;font-size:24px;font-weight:700;}
    .card{background:#fff;border-radius:6px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:20px;}
    .stat{text-align:center;} .stat .n{font-size:32px;font-weight:700;color:var(--brand);line-height:1.1;} .stat .l{font-size:12px;color:#888;text-transform:uppercase;}
    table.t{width:100%;} table.t th{font-size:12px;text-transform:uppercase;color:#888;font-weight:600;border-bottom:2px solid #eee;padding:8px;white-space:nowrap;}
    table.t td{padding:8px;border-bottom:1px solid #f0f0f0;vertical-align:middle;} table.t tr:hover td{background:#fafbfc;}
    .thumb{width:64px;height:44px;object-fit:cover;border-radius:3px;background:#eee;} .thumb.logo{object-fit:contain;background:#fff;border:1px solid #eee;}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;} .toolbar .grow{flex:1;min-width:180px;}
    .img-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
    .img-tile{position:relative;width:130px;height:92px;border-radius:4px;overflow:hidden;border:2px solid #ddd;background:#eee;}
    .img-tile.cover{border-color:var(--brand);} .img-tile img{width:100%;height:100%;object-fit:cover;}
    .img-tile .acts{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:rgba(0,0,0,.6);padding:2px 4px;}
    .img-tile .acts button{background:none;border:0;color:#fff;font-size:12px;padding:2px 4px;cursor:pointer;} .img-tile .acts button:hover{color:var(--brand);}
    .img-tile .badge-cover{position:absolute;top:4px;left:4px;background:var(--brand);color:#fff;font-size:10px;padding:1px 6px;border-radius:3px;}
    .feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px;} .feat-grid label{font-weight:400;margin:0;}
    .form-section{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#888;border-bottom:1px solid #eee;padding-bottom:6px;margin:22px 0 14px;}
    .msg-new{font-weight:700;}
    #toast{position:fixed;right:20px;bottom:20px;z-index:2000;max-width:340px;}
    #toast .alert{margin-top:8px;box-shadow:0 4px 14px rgba(0,0,0,.15);}
    .menu-toggle{display:none;position:fixed;top:10px;left:10px;z-index:150;}
    @media(max-width:991px){.sidebar{transform:translateX(-100%);transition:transform .2s;} .sidebar.open{transform:none;} .main{margin-left:0;padding:60px 14px 40px;} .menu-toggle{display:block;}}
  </style>
</head>
<body>

<!-- Sign-in -->
<div id="login-view">
  <img src="/assets/images/logo.png" alt="DirectAuto Import">
  <h4 class="text-center" style="margin-top:0;">Admin sign in</h4>
  <div id="login-alert"></div>
  <form id="login-form">
    <div class="form-group"><label>Email</label><input id="login-email" type="email" class="form-control" required autocomplete="username"></div>
    <div class="form-group"><label>Password</label><input id="login-password" type="password" class="form-control" required autocomplete="current-password"></div>
    <button id="login-btn" class="btn btn-brand btn-block" type="submit">Sign in</button>
  </form>
</div>

<!-- App -->
<div id="app-view">
  <button class="btn btn-default menu-toggle" id="menu-toggle"><i class="fa fa-bars"></i></button>
  <div class="sidebar" id="sidebar">
    <div class="brand"><a href="/"><img src="/assets/images/logo.png" alt="DirectAuto"></a></div>
    <a class="nav-link" href="#dashboard"><i class="fa fa-tachometer"></i>Dashboard</a>
    <a class="nav-link" href="#vehicles"><i class="fa fa-car"></i>Vehicles</a>
    <a class="nav-link" href="#inquiries"><i class="fa fa-envelope"></i>Inquiries <span class="badge" id="nav-new-inq" style="background:var(--brand);display:none;"></span></a>
    <a class="nav-link" href="#live"><i class="fa fa-gavel"></i>Auction requests</a>
    <div class="nav-head">Catalogue</div>
    <a class="nav-link" href="#manufacturers"><i class="fa fa-tags"></i>Brands</a>
    <a class="nav-link" href="#models"><i class="fa fa-list"></i>Models</a>
    <a class="nav-link" href="#types"><i class="fa fa-truck"></i>Body types</a>
    <a class="nav-link" href="#colors"><i class="fa fa-tint"></i>Colours</a>
    <a class="nav-link" href="#features"><i class="fa fa-check-square-o"></i>Features</a>
    <div class="nav-head">Site</div>
    <a class="nav-link" href="/" target="_blank"><i class="fa fa-external-link"></i>View website</a>
    <a class="nav-link" href="#" id="logout-link"><i class="fa fa-sign-out"></i>Sign out</a>
    <div class="who" id="who"></div>
  </div>
  <div class="main" id="main"></div>
</div>

<div id="toast"></div>

<!-- Taxonomy add/edit modal -->
<div class="modal fade" id="tax-modal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <form id="tax-form">
      <div class="modal-header"><button type="button" class="close" data-dismiss="modal">&times;</button><h4 class="modal-title" id="tax-title"></h4></div>
      <div class="modal-body" id="tax-fields"></div>
      <div class="modal-footer"><button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button><button type="submit" class="btn btn-brand">Save</button></div>
    </form>
  </div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/bootstrap.min.js"></script>
<script src="/assets/js/app.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = DA.esc;
  const api = DA.api;
  const main = $('#main');

  const L = { types: [], manufacturers: [], models: [], colors: [], features: [], locations: [] };
  const FUELS = ['Petrol', 'Diesel', 'Hybrid', 'Electric', 'LPG'];
  const GEARS = ['Automatic', 'Manual', 'CVT'];
  const DRIVES = ['2WD', '4WD', 'AWD'];

  /* ---------- helpers ---------- */
  function toast(text, type) {
    const el = document.createElement('div');
    el.className = 'alert alert-' + (type || 'success');
    el.textContent = text;
    $('#toast').appendChild(el);
    setTimeout(() => el.remove(), type === 'danger' ? 6000 : 2800);
  }
  const fail = (e) => toast(e.message || 'Something went wrong', 'danger');
  const fmtDate = (d) => d ? new Date(d).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }) : '';
  const opts = (list, sel, label) => '<option value="">' + (label || '—') + '</option>' +
    list.map((o) => { const v = typeof o === 'object' ? o.id : o; const t = typeof o === 'object' ? o.name : o;
      return '<option value="' + esc(v) + '"' + (String(v) === String(sel == null ? '' : sel) ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');

  async function token() {
    return firebase.auth().currentUser ? firebase.auth().currentUser.getIdToken() : '';
  }
  async function uploadImages(files, folder) {
    const fd = new FormData();
    Array.from(files).forEach((f) => fd.append('images', f));
    const res = await fetch('/api/admin/upload?folder=' + folder, { method: 'POST', headers: { Authorization: 'Bearer ' + await token() }, body: fd });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Upload failed');
    return data.urls;
  }
  async function loadLookups() {
    const [types, manufacturers, models, colors, features, locations] = await Promise.all([
      api.get('/api/admin/taxonomy/types'), api.get('/api/admin/taxonomy/manufacturers'), api.get('/api/admin/taxonomy/models'),
      api.get('/api/admin/taxonomy/colors'), api.get('/api/admin/taxonomy/features'), api.get('/api/locations'),
    ]);
    Object.assign(L, { types, manufacturers, models, colors, features, locations });
  }
  const nameOf = (list, id) => (list.find((x) => x.id === id) || {}).name || '';
  const vehicleTitle = (v) => [v.year, nameOf(L.manufacturers, v.vehicle_manufacturer), nameOf(L.models, v.vehicle_model)].filter(Boolean).join(' ') || 'Vehicle #' + v.id;

  /* ---------- auth ---------- */
  async function boot() {
    let cfg;
    try { await DA.initFirebase(); } catch (e) {
      $('#login-alert').innerHTML = '<div class="alert alert-warning">Firebase is not configured on the server yet, so admin sign-in is unavailable. Set the FIREBASE_* variables (see README) and redeploy.</div>';
      $('#login-btn').disabled = true; return;
    }
    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user) { $('#login-view').style.display = ''; $('#app-view').style.display = 'none'; return; }
      try {
        const stats = await api.get('/api/admin/stats');
        $('#who').textContent = user.email;
        $('#login-view').style.display = 'none'; $('#app-view').style.display = 'block';
        await loadLookups();
        updateInqBadge(stats.new_inquiries);
        route();
      } catch (e) {
        await firebase.auth().signOut();
        $('#login-alert').innerHTML = '<div class="alert alert-danger">' + esc(/403|Admin/.test(e.message) ? 'This account does not have admin access.' : e.message) + '</div>';
      }
    });
  }
  $('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#login-btn'); btn.disabled = true; btn.textContent = 'Signing in…';
    $('#login-alert').innerHTML = '';
    try { await firebase.auth().signInWithEmailAndPassword($('#login-email').value, $('#login-password').value); }
    catch (err) { $('#login-alert').innerHTML = '<div class="alert alert-danger">' + esc(err.message) + '</div>'; }
    btn.disabled = false; btn.textContent = 'Sign in';
  });
  $('#logout-link').addEventListener('click', (e) => { e.preventDefault(); firebase.auth().signOut(); });
  $('#menu-toggle').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
  function updateInqBadge(n) { const b = $('#nav-new-inq'); b.textContent = n || ''; b.style.display = n ? '' : 'none'; }

  /* ---------- router ---------- */
  const TAX = {
    manufacturers: { label: 'Brands', one: 'brand', image: 'brands', imageLabel: 'Logo', featured: true },
    types: { label: 'Body types', one: 'body type', image: 'types', imageLabel: 'Icon (optional)' },
    models: { label: 'Models', one: 'model', parent: true },
    colors: { label: 'Colours', one: 'colour', color: true },
    features: { label: 'Features', one: 'feature' },
  };
  function route() {
    $('#sidebar').classList.remove('open');
    const h = (location.hash || '#dashboard').slice(1);
    const [page, arg] = h.split('/');
    $$('.sidebar a.nav-link').forEach((a) => a.classList.toggle('active', a.getAttribute('href') === '#' + page || (page === 'vehicle' && a.getAttribute('href') === '#vehicles')));
    main.onclick = null;
    main.innerHTML = '<p class="text-muted"><i class="fa fa-spinner fa-spin"></i> Loading…</p>';
    window.scrollTo(0, 0);
    const run = {
      dashboard: viewDashboard, vehicles: viewVehicles, vehicle: () => viewVehicleForm(arg),
      inquiries: viewInquiries, live: viewLive,
    }[page] || (TAX[page] ? () => viewTaxonomy(page) : viewDashboard);
    Promise.resolve(run()).catch(fail);
  }
  window.addEventListener('hashchange', () => { if ($('#app-view').style.display === 'block') route(); });

  /* ---------- dashboard ---------- */
  async function viewDashboard() {
    const [s, inq] = await Promise.all([api.get('/api/admin/stats'), api.get('/api/admin/inquiries')]);
    updateInqBadge(s.new_inquiries);
    const stat = (n, l, href) => '<div class="col-sm-4 col-md-2"><a href="' + href + '" style="text-decoration:none;"><div class="card stat"><div class="n">' + n + '</div><div class="l">' + l + '</div></div></a></div>';
    main.innerHTML = '<h2>Dashboard</h2><div class="row">' +
      stat(s.vehicles, 'Vehicles', '#vehicles') + stat(s.published, 'Published', '#vehicles') + stat(s.new_inquiries, 'New inquiries', '#inquiries') +
      stat(s.inquiries, 'All inquiries', '#inquiries') + stat(s.live_requests, 'Auction requests', '#live') + stat(s.subscribers, 'Subscribers', '#dashboard') + '</div>' +
      '<div class="card"><h4 style="margin-top:0;">Latest inquiries</h4>' + (inq.length ? '<table class="t"><thead><tr><th>Date</th><th>From</th><th>Vehicle</th><th>Message</th></tr></thead><tbody>' +
      inq.slice(0, 6).map((i) => '<tr><td>' + fmtDate(i.created_at) + '</td><td>' + esc(i.name) + '</td><td>' + esc([i.manufacturer_name, i.model_name].filter(Boolean).join(' ') || 'General') +
        '</td><td>' + esc(String(i.message).slice(0, 90)) + '</td></tr>').join('') + '</tbody></table>' : '<p class="text-muted">No inquiries yet.</p>') + '</div>';
  }

  /* ---------- vehicles list ---------- */
  async function viewVehicles() {
    const rows = await api.get('/api/admin/vehicles');
    main.innerHTML = '<h2>Vehicles</h2><div class="card">' +
      '<div class="toolbar"><input id="v-search" class="form-control grow" placeholder="Search by make, model, year, chassis…">' +
      '<select id="v-status" class="form-control" style="width:auto;"><option value="">All statuses</option><option value="1">Published</option><option value="0">Hidden</option></select>' +
      '<a href="#vehicle/new" class="btn btn-brand"><i class="fa fa-plus"></i> Add vehicle</a></div>' +
      '<div class="table-responsive"><table class="t"><thead><tr><th></th><th>Vehicle</th><th>Location</th><th>Price</th><th>Flags</th><th>Status</th><th></th></tr></thead><tbody id="v-body"></tbody></table></div>' +
      '<p class="text-muted" id="v-count"></p></div>';
    const draw = () => {
      const q = $('#v-search').value.toLowerCase(), st = $('#v-status').value;
      const list = rows.filter((v) => (!st || String(v.status) === st) &&
        (!q || [v.manufacturer_name, v.model_name, v.year, v.chassi_id, v.type_name, v.location].join(' ').toLowerCase().includes(q)));
      $('#v-count').textContent = list.length + ' of ' + rows.length + ' vehicles';
      $('#v-body').innerHTML = list.map((v) => '<tr data-id="' + v.id + '">' +
        '<td><img class="thumb" src="' + esc((v.images || [])[0] || '/assets/images/no-image.jpg') + '" alt=""></td>' +
        '<td><a href="#vehicle/' + v.id + '"><strong>' + esc(vehicleTitle(v)) + '</strong></a><br><small class="text-muted">' + esc(v.type_name || '') + (v.chassi_id ? ' · ' + esc(v.chassi_id) : '') + '</small></td>' +
        '<td>' + esc(v.location || '—') + '</td><td>' + DA.money(v.price) + '</td>' +
        '<td>' + (v.is_featured ? '<span class="label label-warning">Featured</span> ' : '') + (v.is_latest ? '<span class="label label-info">Latest</span>' : '') + '</td>' +
        '<td>' + (v.status === 1 ? '<span class="label label-success">Published</span>' : '<span class="label label-default">Hidden</span>') + '</td>' +
        '<td class="text-right" style="white-space:nowrap;"><a class="btn btn-default btn-xs" href="#vehicle/' + v.id + '"><i class="fa fa-pencil"></i> Edit</a> ' +
        '<button class="btn btn-default btn-xs" data-act="toggle"><i class="fa fa-' + (v.status === 1 ? 'eye-slash' : 'eye') + '"></i> ' + (v.status === 1 ? 'Hide' : 'Publish') + '</button> ' +
        '<button class="btn btn-danger btn-xs" data-act="del"><i class="fa fa-trash"></i></button></td></tr>').join('') ||
        '<tr><td colspan="7" class="text-center text-muted">No vehicles found.</td></tr>';
    };
    draw();
    $('#v-search').addEventListener('input', draw); $('#v-status').addEventListener('change', draw);
    $('#v-body').addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-act]'); if (!btn) return;
      const id = Number(btn.closest('tr').dataset.id), v = rows.find((x) => x.id === id);
      try {
        if (btn.dataset.act === 'toggle') {
          const r = await api.put('/api/admin/vehicles/' + id, { status: v.status === 1 ? 0 : 1 });
          v.status = r.status; toast(r.status === 1 ? 'Published' : 'Hidden'); draw();
        } else if (confirm('Delete "' + vehicleTitle(v) + '" permanently? Its uploaded images are removed too.')) {
          await api.del('/api/admin/vehicles/' + id); rows.splice(rows.indexOf(v), 1); toast('Vehicle deleted'); draw();
        }
      } catch (err) { fail(err); }
    });
  }

  /* ---------- vehicle add / edit ---------- */
  async function viewVehicleForm(arg) {
    const isNew = !arg || arg === 'new';
    let v = { images: [], feature_ids: [], status: 1, is_featured: false, is_latest: true, location: 'Japan' };
    if (!isNew) {
      const all = await api.get('/api/admin/vehicles');
      v = all.find((x) => x.id === Number(arg));
      if (!v) { main.innerHTML = '<div class="alert alert-warning">Vehicle not found. <a href="#vehicles">Back to list</a></div>'; return; }
    }
    let images = (v.images || []).slice();
    const fld = (id, label, html, cls) => '<div class="form-group ' + (cls || 'col-sm-6 col-md-3') + '"><label for="vf-' + id + '">' + label + '</label>' + html + '</div>';
    const inp = (id, type, val, extra) => '<input id="vf-' + id + '" type="' + type + '" class="form-control" value="' + esc(val == null ? '' : val) + '" ' + (extra || '') + '>';
    const sel = (id, html) => '<select id="vf-' + id + '" class="form-control">' + html + '</select>';
    const feats = (v.feature_ids || []).map(Number);

    main.innerHTML = '<h2>' + (isNew ? 'Add vehicle' : 'Edit vehicle') + '</h2><form id="vform" class="card"><div class="row">' +
      '<div class="col-xs-12"><div class="form-section" style="margin-top:0;">Basics</div></div>' +
      fld('vehicle_manufacturer', 'Brand *', sel('vehicle_manufacturer', opts(L.manufacturers.filter((m) => m.status === 1 || m.id === v.vehicle_manufacturer), v.vehicle_manufacturer, 'Select brand'))) +
      fld('vehicle_model', 'Model', sel('vehicle_model', '')) +
      fld('vehicle_type', 'Body type *', sel('vehicle_type', opts(L.types, v.vehicle_type, 'Select type'))) +
      fld('year', 'Year', inp('year', 'text', v.year, 'maxlength="4" placeholder="2019"')) +
      fld('location', 'Inventory location', sel('location', opts(L.locations.map((l) => l.name), v.location, 'Not set'))) +
      fld('price', 'Price (Rs.)', inp('price', 'number', v.price, 'min="0" step="1000" placeholder="Leave blank for Price on request"')) +
      fld('main_color', 'Colour', sel('main_color', opts(L.colors, v.main_color, 'Select colour'))) +
      fld('chassi_id', 'Chassis no.', inp('chassi_id', 'text', v.chassi_id)) +
      '<div class="col-xs-12"><div class="form-section">Specifications</div></div>' +
      fld('mileage', 'Mileage (km)', inp('mileage', 'text', v.mileage)) +
      fld('engine_capacity', 'Engine (cc)', inp('engine_capacity', 'text', v.engine_capacity)) +
      fld('fuel_type', 'Fuel', sel('fuel_type', opts(FUELS, v.fuel_type, '—'))) +
      fld('transmission', 'Transmission', sel('transmission', opts(GEARS, v.transmission, '—'))) +
      fld('drive_type', 'Drive', sel('drive_type', opts(DRIVES, v.drive_type, '—'))) +
      fld('auction_grade', 'Auction grade', inp('auction_grade', 'text', v.auction_grade, 'placeholder="4.5"')) +
      fld('grade', 'Interior grade', inp('grade', 'text', v.grade, 'placeholder="A"')) +
      fld('seats', 'Seats', inp('seats', 'number', v.seats, 'min="0"')) +
      fld('doors', 'Doors', inp('doors', 'number', v.doors, 'min="0"')) +
      fld('passengers', 'Passengers', inp('passengers', 'number', v.passengers, 'min="0"')) +
      fld('other_color', 'Other colour notes', inp('other_color', 'text', v.other_color)) +
      fld('conditions', 'Condition', inp('conditions', 'text', v.conditions, 'maxlength="500"'), 'col-sm-12 col-md-6') +
      fld('description', 'Description', '<textarea id="vf-description" class="form-control" rows="3" maxlength="500">' + esc(v.description || '') + '</textarea>', 'col-xs-12') +
      '</div>' +
      '<div class="form-section">Images <small class="text-muted">— first image is the cover shown in listings</small></div>' +
      '<input type="file" id="img-input" accept="image/*" multiple style="display:none;">' +
      '<button type="button" class="btn btn-default" id="img-add"><i class="fa fa-upload"></i> Upload images</button> <span id="img-status" class="text-muted"></span>' +
      '<div class="img-grid" id="img-grid"></div>' +
      '<div class="form-section">Features</div><div class="feat-grid">' +
      L.features.filter((f) => f.status === 1 || feats.includes(f.id)).map((f) => '<label><input type="checkbox" name="feat" value="' + f.id + '"' + (feats.includes(f.id) ? ' checked' : '') + '> ' + esc(f.name) + '</label>').join('') + '</div>' +
      '<div class="form-section">Visibility</div><div class="row">' +
      fld('status', 'Status', sel('status', '<option value="1"' + (v.status === 1 ? ' selected' : '') + '>Published</option><option value="0"' + (v.status === 0 ? ' selected' : '') + '>Hidden (draft)</option>')) +
      '<div class="col-sm-6 col-md-9" style="padding-top:26px;"><label style="margin-right:20px;font-weight:400;"><input type="checkbox" id="vf-is_featured"' + (v.is_featured ? ' checked' : '') + '> Featured on home page</label>' +
      '<label style="font-weight:400;"><input type="checkbox" id="vf-is_latest"' + (v.is_latest ? ' checked' : '') + '> Show in Latest Arrivals</label></div></div>' +
      '<hr><button class="btn btn-brand" type="submit" id="v-save"><i class="fa fa-save"></i> ' + (isNew ? 'Create vehicle' : 'Save changes') + '</button> <a href="#vehicles" class="btn btn-default">Cancel</a>' +
      (!isNew && v.status === 1 ? ' <a class="btn btn-link" target="_blank" href="/our-stock/' + encodeURIComponent(v.seo_url) + '">View on site <i class="fa fa-external-link"></i></a>' : '') +
      '</form>';

    // brand -> model dependency
    const fillModels = (sel) => {
      const mid = Number($('#vf-vehicle_manufacturer').value);
      $('#vf-vehicle_model').innerHTML = opts(L.models.filter((m) => m.manufacturer_id === mid && (m.status === 1 || m.id === sel)), sel, mid ? 'Select model' : 'Select brand first');
    };
    fillModels(v.vehicle_model);
    $('#vf-vehicle_manufacturer').addEventListener('change', () => fillModels(null));

    // images
    const drawImages = () => {
      $('#img-grid').innerHTML = images.map((u, i) => '<div class="img-tile' + (i === 0 ? ' cover' : '') + '" data-i="' + i + '"><img src="' + esc(u) + '" alt="">' +
        (i === 0 ? '<span class="badge-cover">Cover</span>' : '') +
        '<div class="acts"><button type="button" data-a="cover" title="Make cover"><i class="fa fa-star"></i></button><button type="button" data-a="left" title="Move left"><i class="fa fa-arrow-left"></i></button>' +
        '<button type="button" data-a="right" title="Move right"><i class="fa fa-arrow-right"></i></button><button type="button" data-a="rm" title="Remove"><i class="fa fa-trash"></i></button></div></div>').join('');
    };
    drawImages();
    $('#img-grid').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-a]'); if (!b) return;
      const i = Number(b.closest('.img-tile').dataset.i), a = b.dataset.a;
      const move = (from, to) => { if (to < 0 || to >= images.length) return; images.splice(to, 0, images.splice(from, 1)[0]); };
      if (a === 'cover') move(i, 0); else if (a === 'left') move(i, i - 1); else if (a === 'right') move(i, i + 1); else if (a === 'rm') images.splice(i, 1);
      drawImages();
    });
    $('#img-add').addEventListener('click', () => $('#img-input').click());
    $('#img-input').addEventListener('change', async (e) => {
      const files = e.target.files; if (!files.length) return;
      $('#img-status').innerHTML = '<i class="fa fa-spinner fa-spin"></i> Uploading ' + files.length + ' image(s)…';
      try { images = images.concat(await uploadImages(files, 'vehicles')); drawImages(); $('#img-status').textContent = ''; }
      catch (err) { $('#img-status').textContent = ''; fail(err); }
      e.target.value = '';
    });

    $('#vform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const g = (id) => $('#vf-' + id).value.trim();
      if (!g('vehicle_manufacturer') || !g('vehicle_type')) return toast('Please choose a brand and a body type.', 'danger');
      const body = { images, feature_ids: $$('input[name=feat]:checked').map((c) => Number(c.value)),
        is_featured: $('#vf-is_featured').checked, is_latest: $('#vf-is_latest').checked };
      ['vehicle_manufacturer', 'vehicle_model', 'vehicle_type', 'year', 'location', 'price', 'main_color', 'chassi_id', 'mileage', 'engine_capacity', 'fuel_type',
        'transmission', 'drive_type', 'auction_grade', 'grade', 'seats', 'doors', 'passengers', 'other_color', 'conditions', 'description', 'status'].forEach((k) => { body[k] = g(k); });
      const btn = $('#v-save'); btn.disabled = true;
      try {
        if (isNew) await api.post('/api/admin/vehicles', body); else await api.put('/api/admin/vehicles/' + v.id, body);
        toast(isNew ? 'Vehicle created' : 'Changes saved'); location.hash = '#vehicles';
      } catch (err) { fail(err); btn.disabled = false; }
    });
  }

  /* ---------- inquiries ---------- */
  async function viewInquiries() {
    let rows = await api.get('/api/admin/inquiries');
    const draw = () => {
      updateInqBadge(rows.filter((r) => r.status === 0).length);
      main.innerHTML = '<h2>Vehicle inquiries</h2><div class="card">' + (rows.length ? '<div class="table-responsive"><table class="t"><thead><tr><th>Date</th><th>From</th><th>Vehicle</th><th>Message</th><th></th></tr></thead><tbody>' +
        rows.map((i) => '<tr data-id="' + i.id + '" class="' + (i.status === 0 ? 'msg-new' : '') + '"><td style="white-space:nowrap;">' + fmtDate(i.created_at) + '</td>' +
          '<td>' + esc(i.name) + '<br><a href="mailto:' + esc(i.email) + '">' + esc(i.email) + '</a>' + (i.phone ? '<br>' + esc(i.phone) : '') + '</td>' +
          '<td>' + (i.seo_url ? '<a target="_blank" href="/our-stock/' + encodeURIComponent(i.seo_url) + '">' + esc([i.manufacturer_name, i.model_name].filter(Boolean).join(' ')) + '</a>' : 'General') + '</td>' +
          '<td style="max-width:360px;white-space:pre-wrap;">' + esc(i.message) + '</td>' +
          '<td class="text-right" style="white-space:nowrap;"><button class="btn btn-default btn-xs" data-act="mark">' + (i.status === 0 ? '<i class="fa fa-check"></i> Mark handled' : 'Mark new') + '</button> ' +
          '<button class="btn btn-danger btn-xs" data-act="del"><i class="fa fa-trash"></i></button></td></tr>').join('') + '</tbody></table></div>' : '<p class="text-muted">No inquiries yet.</p>') + '</div>';
    };
    draw();
    main.onclick = async (e) => {
      const b = e.target.closest('button[data-act]'); if (!b) return;
      const id = Number(b.closest('tr').dataset.id), r = rows.find((x) => x.id === id);
      try {
        if (b.dataset.act === 'mark') { r.status = r.status === 0 ? 1 : 0; await api.put('/api/admin/inquiries/' + id, { status: r.status }); }
        else if (confirm('Delete this inquiry?')) { await api.del('/api/admin/inquiries/' + id); rows = rows.filter((x) => x !== r); }
        draw();
      } catch (err) { fail(err); }
    };
  }

  /* ---------- live auction requests ---------- */
  async function viewLive() {
    const rows = await api.get('/api/admin/live-inquiries');
    main.innerHTML = '<h2>Auction data requests</h2><div class="card">' + (rows.length ? '<div class="table-responsive"><table class="t"><thead><tr><th>Date</th><th>From</th><th>Looking for</th><th>Notes</th><th></th></tr></thead><tbody>' +
      rows.map((r) => '<tr data-id="' + r.id + '"><td style="white-space:nowrap;">' + fmtDate(r.created_at) + '</td><td>' + esc(r.name) + '<br>' + esc(r.email) + '</td>' +
        '<td><strong>' + esc([r.year, r.make, r.model].filter(Boolean).join(' ')) + '</strong><br><small>' + esc([r.color, r.grade && 'Grade ' + r.grade].filter(Boolean).join(' · ')) + '</small></td>' +
        '<td style="white-space:pre-wrap;max-width:320px;">' + esc(r.message) + '</td>' +
        '<td><button class="btn btn-' + (r.status ? 'default' : 'brand') + ' btn-xs">' + (r.status ? 'Mark new' : '<i class="fa fa-check"></i> Mark done') + '</button></td></tr>').join('') +
      '</tbody></table></div>' : '<p class="text-muted">No requests yet.</p>') + '</div>';
    $$('tbody button', main).forEach((b) => b.addEventListener('click', async () => {
      const id = Number(b.closest('tr').dataset.id), r = rows.find((x) => x.id === id);
      try { await api.put('/api/admin/live-inquiries/' + id, { status: r.status ? 0 : 1 }); viewLive(); } catch (err) { fail(err); }
    }));
  }

  /* ---------- taxonomy (brands, types, models, colours, features) ---------- */
  async function viewTaxonomy(kind) {
    const cfg = TAX[kind];
    const rows = L[kind] = await api.get('/api/admin/taxonomy/' + kind);
    const brandName = (id) => nameOf(L.manufacturers, id);
    main.innerHTML = '<h2>' + cfg.label + '</h2><div class="card"><div class="toolbar"><input id="t-search" class="form-control grow" placeholder="Search…">' +
      (cfg.parent ? '<select id="t-parent" class="form-control" style="width:auto;">' + opts(L.manufacturers, '', 'All brands') + '</select>' : '') +
      '<button class="btn btn-brand" id="t-add"><i class="fa fa-plus"></i> Add ' + cfg.one + '</button></div>' +
      '<div class="table-responsive"><table class="t"><thead><tr>' + (cfg.image ? '<th></th>' : cfg.color ? '<th></th>' : '') + '<th>Name</th>' +
      (cfg.parent ? '<th>Brand</th>' : '') + '<th>Vehicles</th><th>Visible</th><th></th></tr></thead><tbody id="t-body"></tbody></table></div><p class="text-muted" id="t-count"></p></div>';
    const draw = () => {
      const q = $('#t-search').value.toLowerCase(), p = cfg.parent ? $('#t-parent').value : '';
      const list = rows.filter((r) => (!q || r.name.toLowerCase().includes(q)) && (!p || String(r.manufacturer_id) === p));
      $('#t-count').textContent = list.length + ' item(s)';
      $('#t-body').innerHTML = list.map((r) => '<tr data-id="' + r.id + '">' +
        (cfg.image ? '<td>' + (r.image ? '<img class="thumb logo" src="' + esc(r.image) + '" alt="">' : '<span class="text-muted">—</span>') + '</td>' : '') +
        (cfg.color ? '<td><span style="display:inline-block;width:22px;height:22px;border-radius:50%;border:1px solid #ccc;background:' + esc(r.code || '#fff') + ';"></span></td>' : '') +
        '<td><strong>' + esc(r.name) + '</strong>' + (r.is_featured ? ' <span class="label label-warning">Footer</span>' : '') + '</td>' +
        (cfg.parent ? '<td>' + esc(brandName(r.manufacturer_id)) + '</td>' : '') +
        '<td>' + (r.vehicle_count || 0) + '</td><td>' + (r.status === 1 ? '<span class="label label-success">Yes</span>' : '<span class="label label-default">Hidden</span>') + '</td>' +
        '<td class="text-right" style="white-space:nowrap;"><button class="btn btn-default btn-xs" data-act="edit"><i class="fa fa-pencil"></i> Edit</button> ' +
        '<button class="btn btn-danger btn-xs" data-act="del"><i class="fa fa-trash"></i></button></td></tr>').join('') || '<tr><td colspan="6" class="text-center text-muted">Nothing here yet.</td></tr>';
    };
    draw();
    $('#t-search').addEventListener('input', draw); if (cfg.parent) $('#t-parent').addEventListener('change', draw);
    $('#t-add').addEventListener('click', () => openTaxModal(kind, null, () => viewTaxonomy(kind)));
    $('#t-body').addEventListener('click', async (e) => {
      const b = e.target.closest('button[data-act]'); if (!b) return;
      const r = rows.find((x) => x.id === Number(b.closest('tr').dataset.id));
      if (b.dataset.act === 'edit') return openTaxModal(kind, r, () => viewTaxonomy(kind));
      const warn = r.vehicle_count ? '\n\n' + r.vehicle_count + ' vehicle(s) use it and will lose this value (the vehicles are kept).' + (kind === 'manufacturers' ? ' Its models will be deleted.' : '') : '';
      if (!confirm('Delete "' + r.name + '"?' + warn)) return;
      try { await api.del('/api/admin/taxonomy/' + kind + '/' + r.id); toast('Deleted'); viewTaxonomy(kind); } catch (err) { fail(err); }
    });
  }

  function openTaxModal(kind, row, done) {
    const cfg = TAX[kind], r = row || { status: 1 };
    let image = r.image || '';
    $('#tax-title').textContent = (row ? 'Edit ' : 'Add ') + cfg.one;
    $('#tax-fields').innerHTML =
      (cfg.parent ? '<div class="form-group"><label>Brand *</label><select id="tx-parent" class="form-control" required>' + opts(L.manufacturers, r.manufacturer_id, 'Select brand') + '</select></div>' : '') +
      '<div class="form-group"><label>Name *</label><input id="tx-name" class="form-control" required value="' + esc(r.name || '') + '"></div>' +
      (cfg.color ? '<div class="form-group"><label>Colour swatch</label><input id="tx-code" type="color" class="form-control" style="width:80px;padding:2px;" value="' + esc(/^#[0-9a-f]{6}$/i.test(r.code || '') ? r.code : '#ffffff') + '"></div>' : '') +
      (cfg.image ? '<div class="form-group"><label>' + cfg.imageLabel + '</label><div><img id="tx-preview" class="thumb logo" style="width:80px;height:56px;' + (image ? '' : 'display:none;') + '" src="' + esc(image) + '" alt=""> ' +
        '<input type="file" id="tx-file" accept="image/*" style="display:inline-block;"> <span id="tx-up" class="text-muted"></span></div></div>' : '') +
      (cfg.featured ? '<div class="checkbox"><label><input type="checkbox" id="tx-feat"' + (r.is_featured ? ' checked' : '') + '> Show in website footer "Top Categories"</label></div>' : '') +
      '<div class="checkbox"><label><input type="checkbox" id="tx-visible"' + (r.status !== 0 ? ' checked' : '') + '> Visible on the website</label></div>';
    const file = $('#tx-file');
    if (file) file.addEventListener('change', async () => {
      if (!file.files.length) return;
      $('#tx-up').textContent = 'Uploading…';
      try { image = (await uploadImages(file.files, cfg.image))[0]; $('#tx-preview').src = image; $('#tx-preview').style.display = ''; $('#tx-up').textContent = ''; }
      catch (err) { $('#tx-up').textContent = ''; fail(err); }
    });
    $('#tax-form').onsubmit = async (e) => {
      e.preventDefault();
      const body = { name: $('#tx-name').value.trim(), status: $('#tx-visible').checked ? 1 : 0 };
      if (cfg.parent) body.manufacturer_id = Number($('#tx-parent').value);
      if (cfg.color) body.code = $('#tx-code').value;
      if (cfg.image) body.image = image;
      if (cfg.featured) body.is_featured = $('#tx-feat').checked;
      try {
        if (row) await api.put('/api/admin/taxonomy/' + kind + '/' + row.id, body); else await api.post('/api/admin/taxonomy/' + kind, body);
        $('#tax-modal').classList.remove('in'); jQuery('#tax-modal').modal('hide'); toast('Saved'); done();
      } catch (err) { fail(err); }
    };
    jQuery('#tax-modal').modal('show');
  }

  boot();
})();
</script>
</body>
</html>
