<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us — DirectAuto Import</title>
  <link rel="shortcut icon" href="/assets/images/favicon-icon/favicon.png">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/assets/css/orange.css" title="orange">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">
  <style>.page-title{background:#1c2331;color:#fff;padding:40px 0;margin-bottom:30px;} .contact-info li{list-style:none;margin-bottom:16px;} .contact-info i{color:#f76b1c;width:26px;}</style>
</head>
<body>
  <div id="site-header"></div>

  <div class="page-title"><div class="container"><h2 style="color:#fff;margin:0;">Contact Us</h2></div></div>

  <section class="container" style="margin-bottom:50px;">
    <div class="row">
      <div class="col-md-5">
        <h3>Get in touch</h3>
        <p class="text-muted">Have a question about a vehicle or the import process? We'd love to help.</p>
        <ul class="contact-info" style="padding:0;">
          <li><i class="fa fa-map-marker"></i> Colombo, Sri Lanka</li>
          <li><i class="fa fa-phone"></i> <a href="tel:+94768656515">+94 768 65 65 15</a></li>
          <li><i class="fa fa-envelope"></i> <a href="mailto:info@directautoimport.lk">info@directautoimport.lk</a></li>
          <li><i class="fa fa-instagram"></i> <a href="https://www.instagram.com/directautoimport.lk/">@directautoimport.lk</a></li>
        </ul>
      </div>
      <div class="col-md-7">
        <div style="background:#fff;border:1px solid #eee;border-radius:6px;padding:24px;">
          <form id="contact-form">
            <div class="row">
              <div class="col-sm-6 form-group"><input class="form-control" id="c-name" placeholder="Your name" required></div>
              <div class="col-sm-6 form-group"><input class="form-control" id="c-email" type="email" placeholder="Email" required></div>
            </div>
            <div class="form-group"><input class="form-control" id="c-phone" placeholder="Phone"></div>
            <div class="form-group"><textarea class="form-control" id="c-message" rows="6" placeholder="How can we help?" required></textarea></div>
            <button class="btn" id="c-submit" type="submit">Send Message</button>
            <div id="c-msg" style="margin-top:12px;"></div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="/assets/js/jquery.min.js"></script>
  <script src="/assets/js/bootstrap.min.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    DA.pageInit = function () {
      document.getElementById('contact-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('c-submit'); const msg = document.getElementById('c-msg');
        btn.disabled = true; btn.textContent = 'Sending…';
        try {
          const r = await DA.api.post('/api/inquiries', {
            name: document.getElementById('c-name').value,
            email: document.getElementById('c-email').value,
            phone: document.getElementById('c-phone').value,
            message: document.getElementById('c-message').value,
          });
          msg.innerHTML = '<span class="text-success">' + DA.esc(r.message) + '</span>';
          e.target.reset();
        } catch (err) {
          msg.innerHTML = '<span class="text-danger">' + DA.esc(err.message) + '</span>';
        } finally { btn.disabled = false; btn.textContent = 'Send Message'; }
      });
    };
  </script>
</body>
</html>
