<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare Vehicles — DirectAuto Import</title>
  <link rel="shortcut icon" href="/assets/images/favicon-icon/favicon.png">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/assets/css/orange.css" title="orange">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">
  <style>.page-title{background:#1c2331;color:#fff;padding:40px 0;margin-bottom:30px;} .cmp td,.cmp th{padding:10px 12px;border:1px solid #eee;vertical-align:top;} .cmp th{background:#f7f8fb;}</style>
</head>
<body>
  <div id="site-header"></div>
  <div class="page-title"><div class="container"><h2 style="color:#fff;margin:0;">Compare Vehicles</h2></div></div>
  <section class="container" style="margin-bottom:50px;">
    <div id="compare-wrap"><p class="text-center" style="padding:40px;">Loading…</p></div>
  </section>
  <div id="site-footer"></div>
  <script src="/assets/js/jquery.min.js"></script>
  <script src="/assets/js/bootstrap.min.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
    DA.pageInit = async function () {
      const ids = DA.compare.list();
      const wrap = document.getElementById('compare-wrap');
      if (!ids.length) { wrap.innerHTML = '<p class="text-center text-muted" style="padding:40px;">No vehicles added to compare yet. Browse <a href="/our-stock">Our Stock</a> and click "Add to Compare".</p>'; return; }
      const cars = [];
      for (const id of ids) { try { const r = await DA.api.get('/api/vehicles/' + id); cars.push(r.vehicle); } catch (e) {} }
      if (!cars.length) { wrap.innerHTML = '<p class="text-center text-muted">Could not load compared vehicles.</p>'; return; }
      const rows = [
        ['Price', (v) => DA.money(v.price)],
        ['Year', (v) => v.year || '—'],
        ['Type', (v) => v.type_name || '—'],
        ['Mileage', (v) => (v.mileage ? v.mileage + ' km' : '—')],
        ['Engine (cc)', (v) => v.engine_capacity || '—'],
        ['Fuel', (v) => v.fuel_type || '—'],
        ['Transmission', (v) => v.transmission || '—'],
        ['Drive', (v) => v.drive_type || '—'],
        ['Colour', (v) => v.color_name || '—'],
        ['Grade', (v) => v.grade || '—'],
      ];
      let html = '<div class="table-responsive"><table class="cmp" style="width:100%;"><thead><tr><th></th>';
      cars.forEach((v) => {
        html += '<th style="text-align:center;"><img src="' + DA.esc(DA.firstImage(v)) + '" style="width:100%;max-width:180px;height:110px;object-fit:cover;border-radius:4px;" onerror="this.src=\'/assets/images/no-image.jpg\'"><br><a href="/our-stock/' + encodeURIComponent(v.seo_url) + '">' + DA.esc(DA.vehicleTitle(v)) + '</a><br><button class="btn btn-xs btn-default" onclick="DA.removeCmp(' + v.id + ')">Remove</button></th>';
      });
      html += '</tr></thead><tbody>';
      rows.forEach(([label, fn]) => { html += '<tr><th>' + label + '</th>' + cars.map((v) => '<td style="text-align:center;">' + DA.esc(fn(v)) + '</td>').join('') + '</tr>'; });
      html += '</tbody></table></div>';
      wrap.innerHTML = html;
    };
    DA.removeCmp = function (id) { DA.compare.toggle(id); DA.pageInit(); };
  </script>
</body>
</html>
