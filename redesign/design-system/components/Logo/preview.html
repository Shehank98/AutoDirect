<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Logo — preview</title>
<style>body{margin:0;background:var(--surface-100)} #root{padding:16px}</style></head>
<body>
<div id="root"></div>
<script>
var A = window.AD, h = React.createElement;
function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
render(h('div',{className:'ad-row',style:{gap:32,alignItems:'center'}},
  h(A.Logo,{size:34}),
  h(A.Logo,{size:22,suffix:'.lk'}),
  h('div',{style:{background:'var(--surface-inverse)',padding:'14px 18px',borderRadius:14}},h(A.Logo,{size:22,inverse:true}))));
</script>
</body>
</html>
