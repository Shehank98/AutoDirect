<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Badge — preview</title>
<style>body{margin:0;background:var(--surface-100)} #root{padding:16px}</style></head>
<body>
<div id="root"></div>
<script>
var A = window.AD, h = React.createElement;
function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
render(h('div',{className:'ad-row'},['neutral','brand','accent','highlight','success','warning','danger','info'].map(function(t){return h(A.Badge,{key:t,tone:t,dot:t!=='highlight'},t==='highlight'?'New arrival':t.charAt(0).toUpperCase()+t.slice(1));})));
</script>
</body>
</html>
