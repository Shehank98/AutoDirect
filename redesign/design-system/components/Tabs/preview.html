<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabs — preview</title>
<style>body{margin:0;background:var(--surface-100)} #root{padding:16px}</style></head>
<body>
<div id="root"></div>
<script>
var A = window.AD, h = React.createElement;
function render(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Demo(){var s=React.useState('stock'),v=s[0],set=s[1];var t=React.useState('All'),f=t[0],setF=t[1];
return h('div',{style:{display:'grid',gap:18}},
 h(A.Tabs,{label:'Search in',tabs:[{id:'stock',label:'In our stock',icon:'car'},{id:'auction',label:'Japan auctions',icon:'gavel'}],value:v,onChange:set}),
 h(A.Tabs,{variant:'line',label:'Status',tabs:[{id:'All',label:'All',count:7},{id:'Available',label:'Available',count:3},{id:'In transit',label:'In transit',count:2},{id:'Sold',label:'Sold',count:1}],value:f,onChange:setF}));}
render(h(Demo));
</script>
</body>
</html>
